name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Run Migrations, Tests, and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: realtime_chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Database Migrations
        env:
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/realtime_chat_test?schema=public"
        run: npx prisma migrate deploy

      - name: Run Test Suite
        env:
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/realtime_chat_test?schema=public"
          JWT_SECRET: "ci-pipeline-temporary-secret"
          PORT: 3000
        run: npm test

      - name: Verify TypeScript Build
        run: npm run build
